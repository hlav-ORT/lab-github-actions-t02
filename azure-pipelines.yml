trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

stages:
  - stage: Build
    displayName: 'Build imagen Docker'
    jobs:
      - job: BuildImage
        displayName: 'Build imagen'
        steps:
          - script: |
              docker build -t lab-github-actions:$(Build.SourceVersion) .
            displayName: 'Docker build'

  - stage: Scan
    displayName: 'Scan de seguridad (Trivy)'
    dependsOn: Build
    jobs:
      - job: TrivyScan
        displayName: 'Escaneo Trivy'
        steps:
          - script: |
              docker build -t lab-github-actions:$(Build.SourceVersion) .
            displayName: 'Docker build (para escaneo)'
          - script: |
              docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
                aquasec/trivy:latest image \
                --exit-code 1 \
                --ignore-unfixed \
                --vuln-type os,library \
                --severity CRITICAL,HIGH \
                lab-github-actions:$(Build.SourceVersion)
            displayName: 'Trivy scan'

  - stage: QualityGate
    displayName: 'Quality Gate (SonarCloud)'
    dependsOn: Scan
    jobs:
      - job: SonarCloudAnalysis
        displayName: 'Análisis SonarCloud'
        steps:
          - task: SonarCloudPrepare@4
            inputs:
              SonarCloud: 'SonarCloud-connection'
              organization: 'ort-devops-2026'
              scannerMode: 'cli'
              configMode: 'file'

          - task: SonarCloudAnalyze@4

          - task: SonarCloudPublish@4
            inputs:
              pollingTimeoutSec: '300'            